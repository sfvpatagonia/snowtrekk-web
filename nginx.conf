server {
    listen 80;

    server_name localhost;

    # Tamaño máximo uploads
    client_max_body_size 100M;

    # Archivos frontend React/Vite
    root /usr/share/nginx/html;
    index index.html;

    # Agent-readiness discovery: point every response at the sitemap
    add_header Link '</sitemap.xml>; rel="sitemap"' always;

    # React Router SPA
    location / {
        try_files $uri /index.html;
    }

    # Proxy backend API
    location /api/ {
        proxy_pass http://backend:1337;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Necesario para sockets/websocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts uploads/videos
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Backend-generated discovery files, mounted at root in the API server
    location ~ ^/(sitemap\.xml|llms\.txt|llms/) {
        proxy_pass http://backend:1337;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Content detail pages: real browser traffic keeps getting the static
    # SPA untouched. Only known non-JS clients are proxied to the backend:
    # AI crawlers / Accept: text/markdown get Markdown (see
    # src/libs/agentUserAgents.js), and social/SEO preview bots get the SPA
    # shell with entity-specific meta/OG tags injected (see
    # htmlShell.controller.js) - the same real index.html either way.
    location ~ ^/(destination|service|shop|activity)/[^/]+/?$ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        set $needs_backend 0;
        if ($http_accept ~* "text/markdown") { set $needs_backend 1; }
        if ($http_user_agent ~* "(GPTBot|ChatGPT-User|ClaudeBot|Claude-User|PerplexityBot|Google-Extended|CCBot|anthropic-ai|OAI-SearchBot)") {
            set $needs_backend 1;
        }
        if ($http_user_agent ~* "(facebookexternalhit|Facebot|Twitterbot|WhatsApp|LinkedInBot|TelegramBot|Slackbot|Discordbot|Googlebot|bingbot|Applebot|Pinterest)") {
            set $needs_backend 1;
        }

        if ($needs_backend = 1) {
            proxy_pass http://backend:1337;
        }

        try_files $uri /index.html;
    }
}