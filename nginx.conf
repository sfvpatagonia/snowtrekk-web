server {
    listen 80;

    server_name localhost;

    # Tamaño máximo uploads
    client_max_body_size 100M;

    # Archivos frontend React/Vite
    root /usr/share/nginx/html;
    index index.html;

    # Agent-readiness discovery: point every response at the sitemap
    add_header Link '</sitemap.xml>; rel="sitemap"' always;

    # React Router SPA
    location / {
        try_files $uri /index.html;
    }

    # Proxy backend API
    location /api/ {
        proxy_pass http://backend:1337;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Necesario para sockets/websocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts uploads/videos
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Backend-generated discovery files, mounted at root in the API server
    location ~ ^/(sitemap\.xml|llms\.txt|llms/) {
        proxy_pass http://backend:1337;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Content detail pages: serve the SPA to browsers as usual, but hand
    # Markdown-negotiating requests (Accept: text/markdown, or a known AI
    # crawler User-Agent - keep in sync with src/libs/agentUserAgents.js in
    # the backend) to the backend's Markdown routes instead.
    location ~ ^/(destination|service|shop|activity)/[^/]+/?$ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        set $wants_markdown 0;
        if ($http_accept ~* "text/markdown") { set $wants_markdown 1; }
        if ($http_user_agent ~* "(GPTBot|ChatGPT-User|ClaudeBot|Claude-User|PerplexityBot|Google-Extended|CCBot|anthropic-ai|OAI-SearchBot)") {
            set $wants_markdown 1;
        }

        if ($wants_markdown = 1) {
            proxy_pass http://backend:1337;
        }

        try_files $uri /index.html;
    }
}