name: Build Frontend Image

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
          --build-arg VITE_API_URL=/api \
          -t ghcr.io/sfvpatagonia/snowtrekk-web:latest .

      - name: Push image
        run: |
          docker push ghcr.io/sfvpatagonia/snowtrekk-web:latest